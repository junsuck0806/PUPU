<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신곡 알림</title>
<meta name="description" content="좋아하는 아티스트의 새 음악을 한곳에서 확인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F8;--ink:#141830;--blue:#3A4DE8;--pink:#D6336C;--line:#D5D8E6;--muted:#5A6080}
*{box-sizing:border-box;margin:0}
body{font:400 1rem/1.6 "IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,.brand{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400}
.wrap{max-width:900px;margin:0 auto;padding:0 1.25rem}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:1rem}
.brand{font-size:1.5rem}
button,.btn{font:inherit;font-weight:600;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.55;cursor:default}
.btn:hover,button:not(:disabled):hover{background:var(--blue);border-color:var(--blue);color:#fff}
.hero{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:2.5rem;align-items:center;padding-block:2.5rem 3rem}
.sleeve{position:relative;aspect-ratio:1;margin-right:20%}
.cover{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 12px 28px rgba(20,24,48,.25)}
.disc{position:absolute;top:4%;left:0;width:92%;aspect-ratio:1;border-radius:50%;transform:translateX(30%);
  background:radial-gradient(circle,var(--pink) 0 14%,#111 15% 18%,#1c1c1c 19% 60%,#2b2b2b 61% 63%,#0d0d0d 64%);
  animation:out 1.1s .3s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes out{from{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.disc{animation:none}}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.1}
.artist{font-size:1.25rem;margin-top:.5rem}
.date{color:var(--muted);margin:.25rem 0 1.25rem}
.group{padding-block:1.5rem}
h2{font-size:1.4rem;padding-bottom:.5rem;border-bottom:2px solid var(--ink)}
ul{list-style:none;padding:0}
li{display:grid;grid-template-columns:56px 1fr auto;gap:1rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line)}
li img{width:56px;height:56px;border-radius:4px;object-fit:cover;background:var(--line)}
.t{text-decoration:none}
.t:hover strong{text-decoration:underline}
.t strong{display:block;font-weight:600}
.t span,.d{color:var(--muted);font-size:.9rem}
.d{text-align:right;white-space:nowrap}
.tag{background:var(--pink);color:#fff;font-size:.75rem;font-weight:600;padding:.05rem .5rem;border-radius:99px;margin-left:.5rem;vertical-align:middle}
.empty{padding:3rem 0;color:var(--muted)}
footer{margin-top:2rem;padding:1.5rem 0;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="brand">신곡 알림</span>
    <button id="noti" class="ghost" hidden>브라우저 알림 켜기</button>
  </div>
</header>
<main class="wrap" id="app"><p class="empty">불러오는 중…</p></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => new Date(d).toLocaleDateString("ko-KR", {timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric"});
const upcoming = r => new Date(r.date) > Date.now();
const daysAgo = r => Math.floor((Date.now() - new Date(r.date)) / 864e5);
const KEY = "seenReleases";

const groups = [
  ["발매 예정", upcoming],
  ["이번 주", r => daysAgo(r) < 7],
  ["지난 주", r => daysAgo(r) < 14],
  ["이전", () => true]
];

const row = r => `<li>
  <img src="${esc(r.cover.replace("600x600", "200x200"))}" alt="" loading="lazy">
  <a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">
    <strong>${esc(r.title)}${!upcoming(r) && daysAgo(r) < 7 ? '<b class="tag">신곡</b>' : ""}</strong>
    <span>${esc(r.artist)}, ${esc(r.type)}</span>
  </a>
  <span class="d">${fmt(r.date)}</span>
</li>`;

function render({updatedAt, releases}) {
  const app = $("#app");
  if (!releases.length) {
    app.innerHTML = '<p class="empty">아직 불러온 신곡이 없어요. 저장소의 Actions 탭에서 update-releases를 한 번 실행해 보세요.</p>';
    return;
  }
  const latest = releases.find(r => !upcoming(r)) || releases[0];
  let html = `<section class="hero">
    <div class="sleeve"><div class="disc"></div><img class="cover" src="${esc(latest.cover)}" alt="${esc(latest.title)} 앨범 커버"></div>
    <div>
      <h1>${esc(latest.title)}</h1>
      <p class="artist">${esc(latest.artist)}</p>
      <p class="date">${fmt(latest.date)} 발매, ${esc(latest.type)}</p>
      <a class="btn" href="${esc(latest.url)}" target="_blank" rel="noopener">Apple Music에서 듣기</a>
    </div></section>`;
  const used = new Set();
  for (const [name, test] of groups) {
    const items = releases.filter(r => !used.has(r.id) && test(r));
    items.forEach(r => used.add(r.id));
    if (items.length) html += `<section class="group"><h2>${name}</h2><ul>${items.map(row).join("")}</ul></section>`;
  }
  app.innerHTML = html;
  $("#foot").textContent = updatedAt ? `마지막 갱신 ${fmt(updatedAt)}. 음악 정보는 Apple Music 카탈로그에서 가져와요.` : "";
}

// 페이지를 열었을 때, 지난 방문 이후 새로 생긴 곡이 있으면 브라우저 알림을 띄워요
function notifyNew(releases) {
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (seen) {
    const fresh = releases.filter(r => !seen.includes(r.id));
    if (fresh.length && "Notification" in window && Notification.permission === "granted") {
      try {
        new Notification(`새로운 음악 ${fresh.length}곡`, {body: fresh.slice(0, 3).map(r => `${r.artist} - ${r.title}`).join("\n")});
      } catch {}
    }
  }
  try { localStorage.setItem(KEY, JSON.stringify(releases.map(r => r.id))); } catch {}
}

const btn = $("#noti");
if ("Notification" in window) {
  btn.hidden = false;
  const sync = () => {
    if (Notification.permission === "granted") { btn.textContent = "알림 켜짐"; btn.disabled = true; }
    else if (Notification.permission === "denied") { btn.textContent = "알림이 차단됨"; btn.disabled = true; }
  };
  sync();
  btn.onclick = () => Notification.requestPermission().then(sync);
}

fetch("data/releases.json", {cache: "no-store"})
  .then(r => r.json())
  .then(d => { render(d); notifyNew(d.releases); })
  .catch(() => { $("#app").innerHTML = '<p class="empty">데이터를 불러오지 못했어요. data/releases.json 파일이 있는지 확인해 주세요.</p>'; });
</script>
</body>
</html>
